plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'si.planina.app'
    compileSdk 34

    defaultConfig {
        applicationId 'si.planina.app'
        minSdk 26
        targetSdk 34
        versionCode = runNo
        versionName = "1." + runNo
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // One fixed key for every build, so a new APK installs over the old one (and the app can
    // update itself). Without it each GitHub build makes its own debug key and Android refuses
    // the update. The key is not in the repo: the workflow writes it from the PLANINA_KEYSTORE
    // secret. Without the secret the build still works, just with a throwaway debug key.
    def planinaKey = file('planina.keystore')
    signingConfigs {
        planina {
            storeFile planinaKey
            storeType 'pkcs12'
            storePassword System.getenv('PLANINA_KEY_PASSWORD') ?: 'planinaapp'
            keyAlias 'planina'
            keyPassword System.getenv('PLANINA_KEY_PASSWORD') ?: 'planinaapp'
        }
    }
    buildTypes {
        if (planinaKey.exists()) {
            debug { signingConfig signingConfigs.planina }
            release { signingConfig signingConfigs.planina }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
