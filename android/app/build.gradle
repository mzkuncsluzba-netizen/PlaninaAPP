plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'si.planina.app'
    compileSdk 34

    defaultConfig {
        applicationId 'si.planina.app'
        minSdk 26
        targetSdk 34
        versionCode = runNo
        versionName = "1." + runNo
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // One fixed key for every build, so a new APK installs over the old one (and the app can
    // update itself). Without it each GitHub build made its own debug key and Android refused
    // the update. The key is in the repo on purpose: the app only ever installs updates it
    // downloads from this repository's own releases.
    signingConfigs {
        planina {
            storeFile file('planina.keystore')
            storeType 'pkcs12'
            storePassword 'planinaapp'
            keyAlias 'planina'
            keyPassword 'planinaapp'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.planina }
        release { signingConfig signingConfigs.planina }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
