name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Copy the web app into the Android app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Signing key from secret
        env:
          PLANINA_KEYSTORE: ${{ secrets.PLANINA_KEYSTORE }}
        run: |
          if [ -n "$PLANINA_KEYSTORE" ]; then
            clean=$(printf '%s' "$PLANINA_KEYSTORE" | tr -d ' \t\r\n')
            bad=$(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=' | wc -c)
            echo "::warning::Key check: ${#clean} characters (expected 3156), ${bad} not base64, starts with MII: $([ "${clean:0:3}" = MII ] && echo yes || echo no)"
            if ! printf '%s' "$clean" | base64 -d > android/app/planina.keystore; then
              echo "::error::PLANINA_KEYSTORE is not valid base64 - paste the key again."
              exit 1
            fi
            echo "Fixed signing key in use ($(stat -c %s android/app/planina.keystore) bytes)."
          else
            echo "::warning::PLANINA_KEYSTORE secret is missing - APK is signed with a throwaway key and will not install over the previous one."
          fi

      - name: Build APK
        working-directory: android
        env:
          PLANINA_KEY_PASSWORD: ${{ secrets.PLANINA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PlaninaAPP.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PlaninaAPP ${{ github.run_number }}
          body: Namestitvena datoteka PlaninaAPP.apk za Android.
          files: PlaninaAPP.apk
          make_latest: true
